<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>starmap frame probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060d; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
// Staged frame probe: each stage adds one part of the star map's drawing load so
// the real cost of every piece can be attributed on this machine's GPU.
const canvas = document.getElementById('stage')
const ctx = canvas.getContext('2d', { alpha: false })
const dpr = Math.min(window.devicePixelRatio || 1, 1.5)
let W = 0
let H = 0
let sky = null

const NODES = 388
const EDGES = 468

function rand(seed) {
  let s = seed >>> 0
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0
    return s / 4294967296
  }
}

function glowSprite(rgb) {
  const c = document.createElement('canvas')
  c.width = 128
  c.height = 128
  const g = c.getContext('2d')
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64)
  grad.addColorStop(0, `rgba(${rgb},1)`)
  grad.addColorStop(0.38, `rgba(${rgb},0.36)`)
  grad.addColorStop(0.7, `rgba(${rgb},0.09)`)
  grad.addColorStop(1, `rgba(${rgb},0)`)
  g.fillStyle = grad
  g.fillRect(0, 0, 128, 128)
  return c
}

let sprites = ['67,200,255', '125,99,255', '255,182,77', '255,207,92', '255,95,174', '47,211,154'].map(glowSprite)

// mirror what client.js does: hand the baked canvases to the GPU as ImageBitmaps
async function promoteSprites() {
  if (typeof createImageBitmap !== 'function') return
  sprites = await Promise.all(sprites.map((canvas) => createImageBitmap(canvas).catch(() => canvas)))
}

const dot = (() => {
  const c = document.createElement('canvas')
  c.width = 8
  c.height = 8
  const g = c.getContext('2d')
  g.fillStyle = '#cfe6ff'
  g.fillRect(2, 2, 4, 4)
  return c
})()

function buildSky() {
  sky = document.createElement('canvas')
  sky.width = Math.round(W * 0.58)
  sky.height = Math.round(H * 0.58)
  const g = sky.getContext('2d')
  const base = g.createLinearGradient(0, 0, sky.width * 0.4, sky.height)
  base.addColorStop(0, '#04060d')
  base.addColorStop(1, '#020308')
  g.fillStyle = base
  g.fillRect(0, 0, sky.width, sky.height)
  const random = rand(7)
  g.globalCompositeOperation = 'lighter'
  for (let i = 0; i < 760; i += 1) {
    g.globalAlpha = 0.2 + random() * 0.4
    g.drawImage(sprites[i % 6], random() * sky.width, random() * sky.height, 2, 2)
  }
  g.globalAlpha = 1
  g.globalCompositeOperation = 'source-over'
}

function resize() {
  W = window.innerWidth
  H = window.innerHeight
  canvas.width = Math.round(W * dpr)
  canvas.height = Math.round(H * dpr)
  buildSky()
}

const nodes = []
const random = rand(42)
for (let i = 0; i < NODES; i += 1) {
  nodes.push({
    x: random(), y: random(),
    depth: 0.4 + random() * 0.8,
    sprite: i % 6,
    radius: 2 + random() * 22,
  })
}
const edges = []
for (let i = 0; i < EDGES; i += 1) {
  edges.push([nodes[Math.floor(random() * NODES)], nodes[Math.floor(random() * NODES)]])
}

// stage bit flags
const STAGE = { sky: 1, edges: 2, stars: 4, tiny: 8, labels: 16, blend: 32 }
let stageMask = STAGE.sky

const frameTimes = []
let last = 0
let running = true

function drawEdges() {
  ctx.lineCap = 'round'
  for (let band = 0; band < 4; band += 1) {
    ctx.globalAlpha = 0.06 + band * 0.05
    ctx.strokeStyle = '#7f8fb3'
    ctx.lineWidth = 1.8 - band * 0.34
    ctx.beginPath()
    for (let i = band; i < edges.length; i += 4) {
      const [a, b] = edges[i]
      const x1 = a.x * W, y1 = a.y * H, x2 = b.x * W, y2 = b.y * H
      const dx = x2 - x1, dy = y2 - y1
      const len = Math.sqrt(dx * dx + dy * dy) || 1
      const bend = Math.min(64, len * 0.12)
      ctx.moveTo(x1, y1)
      ctx.quadraticCurveTo((x1 + x2) / 2 - (dy / len) * bend, (y1 + y2) / 2 + (dx / len) * bend, x2, y2)
    }
    ctx.stroke()
  }
}

function drawStars() {
  for (const node of nodes) {
    const halo = node.radius * 3.7
    ctx.globalAlpha = Math.min(0.95, 0.7 * (1.2 - node.depth * 0.4))
    ctx.drawImage(sprites[node.sprite], node.x * W - halo / 2, node.y * H - halo / 2, halo, halo)
  }
}

function drawTiny() {
  for (const node of nodes) {
    const size = Math.max(2, node.radius * 0.6)
    ctx.globalAlpha = 0.7
    ctx.drawImage(dot, node.x * W - size / 2, node.y * H - size / 2, size, size)
  }
}

function drawLabels() {
  ctx.globalCompositeOperation = 'source-over'
  ctx.font = '500 11px system-ui, sans-serif'
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'
  for (let i = 0; i < 30; i += 1) {
    const node = nodes[(i * 7) % NODES]
    ctx.globalAlpha = 0.85
    ctx.fillStyle = '#e8f2ff'
    ctx.fillText('记忆条目 ' + i, node.x * W, node.y * H + 14)
  }
  ctx.globalAlpha = 1
}

function frame(now) {
  if (!running) return
  if (last !== 0) frameTimes.push(now - last)
  last = now

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.globalCompositeOperation = 'source-over'
  ctx.globalAlpha = 1
  if ((stageMask & STAGE.sky) !== 0) ctx.drawImage(sky, 0, 0, W, H)
  else { ctx.fillStyle = '#04060d'; ctx.fillRect(0, 0, W, H) }

  if ((stageMask & STAGE.blend) !== 0) ctx.globalCompositeOperation = 'lighter'
  if ((stageMask & STAGE.edges) !== 0) drawEdges()
  if ((stageMask & STAGE.stars) !== 0) drawStars()
  if ((stageMask & STAGE.tiny) !== 0) drawTiny()
  if ((stageMask & STAGE.labels) !== 0) drawLabels()
  ctx.globalCompositeOperation = 'source-over'

  requestAnimationFrame(frame)
}

function collect(ms) {
  return new Promise((resolve) => {
    frameTimes.length = 0
    last = 0
    setTimeout(() => {
      const list = frameTimes.slice(2).sort((a, b) => a - b)
      if (list.length === 0) { resolve({ frames: 0, mean: 0 }); return }
      const sum = list.reduce((total, value) => total + value, 0)
      resolve({
        frames: list.length,
        mean: sum / list.length,
        p50: list[Math.floor(list.length * 0.5)],
        p95: list[Math.floor(list.length * 0.95)],
      })
    }, ms)
  })
}

window.probe = {
  async start() {
    resize()
    if (window.PROBE_BITMAP === true) await promoteSprites()
    running = true
    requestAnimationFrame(frame)
    return true
  },
  async useBitmap() {
    window.PROBE_BITMAP = true
    await promoteSprites()
    return sprites[0].constructor.name
  },
  async run(ms) {
    return collect(ms)
  },
  setStage(mask) { stageMask = mask; return stageMask },
  stats() {
    const list = frameTimes.slice().sort((a, b) => a - b)
    if (list.length === 0) return { frames: 0 }
    const sum = list.reduce((total, value) => total + value, 0)
    return {
      frames: list.length,
      mean: sum / list.length,
      p50: list[Math.floor(list.length * 0.5)],
      p95: list[Math.floor(list.length * 0.95)],
      fps: 1000 / (sum / list.length),
      dpr, size: [W, H],
    }
  },
  stop() { running = false; return true },
}
window.__ready = true
</script>
</body>
</html>
